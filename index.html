<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <title>99's Guide</title>
    <!-- Self-hosted fonts — fully offline, no Google CDN dependency.
         All woff2 files are bundled in public/fonts/ via fonts.css. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Preload primary latin subsets for Inter (UI) and Cairo (Arabic UI).
         These are the first font faces decoded on any page load regardless of language.
         crossorigin is required for same-origin font preload to match the CSS fetch. -->
    <link rel="preload" href="/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" fetchpriority="high" />
    <link rel="preload" href="/fonts/Cairo-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" fetchpriority="high" />
    <!-- Preload the app icon used by the launch screen so the logo appears
         on the very first frame — no blank square while the image loads. -->
    <link rel="preload" href="/logo-light.png" as="image" fetchpriority="high" media="(prefers-color-scheme: light)" />
    <link rel="preload" href="/logo-dark.png" as="image" fetchpriority="high" media="(prefers-color-scheme: dark)" />

    <!-- Web App Manifest & Branding -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo-dark.png" media="(prefers-color-scheme: dark)" />
    <!-- apple-touch-icon is retained for home-screen shortcut visual; it does not
         force Safari/PWA presentation mode when the capable flags are omitted. -->
    <link rel="apple-touch-icon" href="/logo-light.png" />
    <!-- The app is a self-contained Capacitor native shell.  Omitting the PWA-capable
         flags prevents iOS from presenting the WKWebView in standalone browser/chrome UI.
         viewport-fit=auto lets the content respect safe-area insets via CSS env() functions
         rather than forcing edge-to-edge Safari/PWA rendering. -->
    <!-- <meta name="mobile-web-app-capable" content="yes" /> -->
    <!-- <meta name="apple-mobile-web-app-capable" content="yes" /> -->
    <!-- <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-title" content="99's Guide" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06152F" />
    
  </head>
  <body style="overscroll-behavior:none;">
    <!-- #root fills the viewport. The app manages its own scroll inside
         dedicated overflow containers with overscroll-behavior containment. -->
    <div id="root" style="position:fixed;inset:0;"></div>
    <script src="/theme-preload.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
